<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#C8A96B" stroke-width="4"/>
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="none" stroke="#174C3A" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Left Header Branding -->
  <g transform="translate(80, 100)">
    <!-- Icon Circle -->
    <rect width="96" height="96" rx="24" fill="#174C3A"/>
    <circle cx="48" cy="48" r="32" fill="none" stroke="#C8A96B" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="48,20 54,44 48,48 42,44" fill="#C8A96B"/>
    <polygon points="48,76 54,52 48,48 42,52" fill="#E8DCC6"/>
    <circle cx="48" cy="48" r="5" fill="#FAF7F2"/>

    <!-- Title & Tagline -->
    <text x="120" y="50" font-family="Cinzel, serif" font-weight="700" font-size="44" fill="#174C3A">GRAM-DISHA</text>
    <text x="120" y="82" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#B45B4A" letter-spacing="2">TEAM ERGON • SMART INDIA HACKATHON 2026</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(80, 260)">
    <text y="0" font-family="Cinzel, serif" font-weight="700" font-size="48" fill="#3B2F2A">Intelligent Business Guidance for</text>
    <text y="60" font-family="Cinzel, serif" font-weight="700" font-size="48" fill="#174C3A">Rural &amp; Semi-Urban India</text>
    
    <text y="130" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="22" fill="#5A6B4F">
      Deterministic Financial Structuring • HBFS Feasibility Index • Versioned Scheme Matching
    </text>
  </g>

  <!-- Key Badges Footer -->
  <g transform="translate(80, 500)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="280" height="48" rx="12" fill="#174C3A" opacity="0.08"/>
    <rect x="0" y="0" width="280" height="48" rx="12" fill="none" stroke="#174C3A" stroke-opacity="0.3"/>
    <text x="20" y="30" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15" fill="#174C3A">🏛️ LGD &amp; AGMARKNET Data</text>

    <!-- Badge 2 -->
    <rect x="300" y="0" width="280" height="48" rx="12" fill="#174C3A" opacity="0.08"/>
    <rect x="300" y="0" width="280" height="48" rx="12" fill="none" stroke="#174C3A" stroke-opacity="0.3"/>
    <text x="320" y="30" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15" fill="#174C3A">📊 Credit-Ready Bank DPRs</text>

    <!-- Badge 3 -->
    <rect x="600" y="0" width="280" height="48" rx="12" fill="#174C3A" opacity="0.08"/>
    <rect x="600" y="0" width="280" height="48" rx="12" fill="none" stroke="#174C3A" stroke-opacity="0.3"/>
    <text x="620" y="30" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15" fill="#174C3A">🛡️ DPDPA 2023 Compliant</text>
  </g>
</svg>
